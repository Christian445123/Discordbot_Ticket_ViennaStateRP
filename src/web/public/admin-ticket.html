<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e1f22" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎫</text></svg>" />
  <title>Ticket – Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark-custom px-4 sticky-top">
    <a class="navbar-brand fw-bold" href="/admin#tickets">
      <i class="bi bi-arrow-left me-2"></i>Zurück
    </a>
    <div class="d-flex align-items-center gap-2">
      <div id="userInfo"></div>
      <a href="/auth/logout" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-box-arrow-right me-1"></i>Abmelden
      </a>
    </div>
  </nav>

  <div class="container py-4" style="max-width:900px">

    <!-- Ticket header -->
    <div id="ticketHeader" class="card bg-dark-card border-0 shadow-sm mb-3">
      <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between align-items-start gap-3">
          <div>
            <h5 id="ticketTitle" class="mb-1 fw-bold">Lade…</h5>
            <div class="d-flex flex-wrap gap-2 align-items-center mt-2" id="ticketMeta"></div>
          </div>
          <a id="transcriptBtn" href="#" target="_blank" rel="noopener" class="btn btn-outline-secondary btn-sm d-none">
            <i class="bi bi-file-earmark-text me-1"></i>Transkript
          </a>
        </div>
      </div>
    </div>

    <p class="text-muted small mb-3">
      <i class="bi bi-eye me-1"></i>Nur-Lese-Ansicht. Antworten, Schließen und Kategorie ändern erfolgt über Discord
      (im Ticket-Kanal bzw. per <code>/kategorie</code>).
    </p>

    <!-- Tab navigation -->
    <div class="tab-bar mb-3" id="ticketTabs">
      <button class="tab-btn active" onclick="switchTicketTab('messages')" id="tab-messages">
        <i class="bi bi-chat-dots-fill me-1"></i>Nachrichten
      </button>
      <button class="tab-btn" onclick="switchTicketTab('notes')" id="tab-notes">
        <i class="bi bi-sticky-fill me-1"></i>Interne Notizen
      </button>
    </div>

    <!-- Messages tab (read-only) -->
    <div id="pane-messages">
      <div id="messagesContainer" class="mb-3">
        <div class="text-center text-muted py-5">
          <div class="spinner-border spinner-border-sm me-2" role="status"></div>Lade Nachrichten…
        </div>
      </div>
    </div>

    <!-- Notes tab (internal admin annotations) -->
    <div id="pane-notes" class="d-none">
      <div id="notesList" class="mb-3"></div>
      <div class="card bg-dark-card border-0">
        <div class="card-body">
          <label class="form-label text-muted small fw-semibold">Neue interne Notiz</label>
          <textarea id="noteInput" class="form-control mb-2" rows="3"
                    placeholder="Interne Notiz (nur im Admin-Webinterface sichtbar, nicht im Ticket-Kanal)…" maxlength="2000"></textarea>
          <button class="btn btn-sm btn-warning" onclick="addNote()">
            <i class="bi bi-sticky-fill me-1"></i>Notiz speichern
          </button>
          <span id="noteAlert" class="ms-2 small text-muted"></span>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/guildSwitcher.js"></script>
  <script src="/js/admin-ticket.js"></script>
</body>
</html>
