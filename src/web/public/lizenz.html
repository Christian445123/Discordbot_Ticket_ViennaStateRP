<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e1f22" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔑</text></svg>" />
  <title>Lizenz – Ticket-System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark-custom px-4 sticky-top">
    <a class="navbar-brand fw-bold" href="/dashboard">
      <i class="bi bi-key-fill text-primary me-2"></i>Ticket-System
    </a>
    <div class="d-flex align-items-center gap-2">
      <a href="/dashboard" class="btn btn-sm btn-outline-secondary">Tickets</a>
      <a href="/moderation" class="btn btn-sm btn-outline-secondary">Moderation</a>
      <a href="/team" class="btn btn-sm btn-outline-secondary">Team</a>
      <a href="/lizenz" class="btn btn-sm btn-outline-secondary active">Lizenz</a>
    </div>
    <div class="d-flex align-items-center gap-3">
      <div id="guildSwitcher"></div>
      <div id="userInfo" class="d-flex align-items-center gap-2"></div>
      <a href="/auth/logout" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-box-arrow-right me-1"></i>Abmelden
      </a>
    </div>
  </nav>

  <div class="container py-4" style="max-width:640px">
    <h5 class="mb-3 fw-semibold"><i class="bi bi-key-fill text-primary me-2"></i>Lizenz</h5>

    <div class="card bg-dark-card border-0 shadow-sm mb-4">
      <div class="card-body" id="statusCard">
        <div class="text-muted small"><div class="spinner-border spinner-border-sm me-2"></div>Lade Status…</div>
      </div>
    </div>

    <div class="card bg-dark-card border-0 shadow-sm">
      <div class="card-body">
        <h6 class="fw-semibold mb-3">Lizenzschlüssel aktivieren</h6>
        <div id="activateAlert" class="alert d-none mb-3"></div>
        <div class="input-group">
          <input type="text" id="activateKey" class="form-control" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX" />
          <button class="btn btn-primary" id="activateBtn" onclick="activateLicense()">
            <i class="bi bi-check-lg me-1"></i>Aktivieren
          </button>
        </div>
        <p class="text-muted small mt-2 mb-0">Nur Server-Administratoren können eine Lizenz aktivieren.</p>
      </div>
    </div>

    <!-- Bot-Admin only: cross-guild license management -->
    <div id="adminSection" class="d-none mt-5">
      <h5 class="mb-3 fw-semibold"><i class="bi bi-shield-lock-fill text-primary me-2"></i>Lizenzverwaltung (Bot-Administrator)</h5>

      <div class="card bg-dark-card border-0 shadow-sm mb-3">
        <div class="card-body">
          <h6 class="fw-semibold mb-3">Neue Lizenz erstellen</h6>
          <div id="createAlert" class="alert d-none mb-3"></div>
          <div class="row g-2 align-items-end">
            <div class="col-md-5">
              <label class="form-label text-muted small">Label (optional)</label>
              <input type="text" id="createLabel" class="form-control form-control-sm" placeholder="z.B. Kunde XY" />
            </div>
            <div class="col-md-3">
              <label class="form-label text-muted small">Max. Server</label>
              <input type="number" id="createMaxGuilds" class="form-control form-control-sm" value="1" min="1" />
            </div>
            <div class="col-md-3">
              <label class="form-label text-muted small">Gültig (Tage, leer=unbefristet)</label>
              <input type="number" id="createDays" class="form-control form-control-sm" min="1" />
            </div>
            <div class="col-md-1">
              <button class="btn btn-primary btn-sm w-100" onclick="createLicense()"><i class="bi bi-plus-lg"></i></button>
            </div>
          </div>
        </div>
      </div>

      <div class="card bg-dark-card border-0 shadow-sm">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-dark table-hover align-middle mb-0">
              <thead>
                <tr><th>Key</th><th>Label</th><th>Status</th><th>Server</th><th>Läuft ab</th><th></th></tr>
              </thead>
              <tbody id="licensesTableBody">
                <tr><td colspan="6" class="text-center text-muted py-4">Lade…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/guildSwitcher.js"></script>
  <script src="/js/lizenz.js"></script>
</body>
</html>
