<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e1f22" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎫</text></svg>" />
  <title>Ticket – Ticket-System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark-custom px-4 sticky-top">
    <a class="navbar-brand fw-bold" href="/dashboard">
      <i class="bi bi-arrow-left me-2"></i>Zurück
    </a>
    <div class="d-flex align-items-center gap-2">
      <div id="userInfo"></div>
      <a href="/auth/logout" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-box-arrow-right me-1"></i>Abmelden
      </a>
    </div>
  </nav>

  <div class="container py-4" style="max-width:900px">

    <!-- Ticket header -->
    <div id="ticketHeader" class="card bg-dark-card border-0 shadow-sm mb-3">
      <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between align-items-start gap-3">
          <div>
            <h5 id="ticketTitle" class="mb-1 fw-bold">Lade…</h5>
            <div class="d-flex flex-wrap gap-2 align-items-center mt-2" id="ticketMeta"></div>
          </div>
          <div class="d-flex gap-2">
            <a id="transcriptBtn" href="#" target="_blank" rel="noopener"
               class="btn btn-outline-secondary btn-sm d-none">
              <i class="bi bi-file-earmark-text me-1"></i>Transkript
            </a>
            <button id="closeBtn" class="btn btn-danger btn-sm d-none" onclick="closeTicket()">
              <i class="bi bi-lock-fill me-1"></i>Ticket schließen
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Tab navigation -->
    <div class="tab-bar mb-3" id="ticketTabs">
      <button class="tab-btn active" onclick="switchTicketTab('messages')" id="tab-messages">
        <i class="bi bi-chat-dots-fill me-1"></i>Nachrichten
      </button>
      <button class="tab-btn" onclick="switchTicketTab('transcript')" id="tab-transcript">
        <i class="bi bi-file-earmark-text-fill me-1"></i>Transkript
      </button>
      <button class="tab-btn d-none" onclick="switchTicketTab('notes')" id="tab-notes">
        <i class="bi bi-sticky-fill me-1"></i>Staff-Notizen
      </button>
    </div>

    <!-- Messages tab -->
    <div id="pane-messages">
      <div id="messagesContainer" class="mb-3">
        <div class="text-center text-muted py-5">
          <div class="spinner-border spinner-border-sm me-2" role="status"></div>Lade Nachrichten…
        </div>
      </div>
      <div id="composerWrap" class="card bg-dark-card border-0 d-none">
        <div class="card-body py-2 px-3">
          <div class="d-flex gap-2 align-items-end">
            <textarea id="composerInput" class="form-control" rows="1" maxlength="1800"
                      placeholder="Nachricht schreiben… (Enter zum Senden, Umschalt+Enter für neue Zeile)"></textarea>
            <button id="composerSendBtn" class="btn btn-primary" onclick="sendMessage()" title="Senden">
              <i class="bi bi-send-fill"></i>
            </button>
          </div>
          <div id="composerAlert" class="small text-danger mt-1"></div>
        </div>
      </div>
      <div id="closedNotice" class="alert alert-secondary small d-none">
        <i class="bi bi-lock-fill me-2"></i>Dieses Ticket ist geschlossen.
      </div>
    </div>

    <!-- Transcript tab -->
    <div id="pane-transcript" class="d-none">
      <div class="card bg-dark-card border-0">
        <div class="card-body text-center py-5">
          <i class="bi bi-file-earmark-text-fill fs-1 text-muted mb-3 d-block"></i>
          <p class="text-muted mb-3">Das Transkript enthält alle gespeicherten Nachrichten dieses Tickets.</p>
          <a id="transcriptOpenBtn" href="#" target="_blank" rel="noopener" class="btn btn-primary">
            <i class="bi bi-box-arrow-up-right me-2"></i>Transkript öffnen
          </a>
          <a id="transcriptDownloadBtn" href="#" download class="btn btn-outline-secondary ms-2">
            <i class="bi bi-download me-1"></i>Download
          </a>
        </div>
      </div>
    </div>

    <!-- Notes tab (staff only) -->
    <div id="pane-notes" class="d-none">
      <div id="notesList" class="mb-3"></div>
      <div class="card bg-dark-card border-0">
        <div class="card-body">
          <label class="form-label text-muted small fw-semibold">Neue Notiz hinzufügen</label>
          <textarea id="noteInput" class="form-control mb-2" rows="3"
                    placeholder="Interne Notiz (nur für Staff sichtbar)…" maxlength="2000"></textarea>
          <button class="btn btn-sm btn-warning" onclick="addNote()">
            <i class="bi bi-sticky-fill me-1"></i>Notiz speichern
          </button>
          <span id="noteAlert" class="ms-2 small text-muted"></span>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/ticket.js"></script>
</body>
</html>
