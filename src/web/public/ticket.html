<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ticket – Ticket-System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark-custom px-4 sticky-top">
    <a class="navbar-brand fw-bold" href="/dashboard">
      <i class="bi bi-arrow-left me-2"></i>Zurück zum Dashboard
    </a>
    <div class="d-flex align-items-center gap-2">
      <div id="userInfo"></div>
      <a href="/auth/logout" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-box-arrow-right me-1"></i>Abmelden
      </a>
    </div>
  </nav>

  <div class="container py-4" style="max-width:860px">

    <!-- Ticket header -->
    <div id="ticketHeader" class="card bg-dark-card border-0 shadow-sm mb-4">
      <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between align-items-start gap-3">
          <div>
            <h5 id="ticketTitle" class="mb-1 fw-bold">Lade…</h5>
            <div class="d-flex flex-wrap gap-2 align-items-center mt-2" id="ticketMeta"></div>
          </div>
          <button id="closeBtn" class="btn btn-danger btn-sm d-none" onclick="closeTicket()">
            <i class="bi bi-lock-fill me-1"></i>Ticket schließen
          </button>
        </div>
      </div>
    </div>

    <!-- Messages -->
    <div id="messagesContainer" class="mb-4">
      <div class="text-center text-muted py-5">
        <div class="spinner-border spinner-border-sm me-2" role="status"></div>
        Lade Nachrichten…
      </div>
    </div>

    <!-- Closed notice -->
    <div id="closedNotice" class="alert alert-secondary d-none">
      <i class="bi bi-lock-fill me-2"></i>
      Dieses Ticket ist geschlossen. Nachrichten können nicht mehr gesendet werden.
    </div>
  </div>

  <script src="/js/ticket.js"></script>
</body>
</html>
