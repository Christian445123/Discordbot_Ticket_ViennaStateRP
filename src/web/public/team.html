<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e1f22" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👥</text></svg>" />
  <title>Team – Ticket-System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark-custom px-4 sticky-top">
    <a class="navbar-brand fw-bold" href="/dashboard">
      <i class="bi bi-people-fill text-primary me-2"></i>Ticket-System
    </a>
    <div class="d-flex align-items-center gap-2">
      <a href="/dashboard" class="btn btn-sm btn-outline-secondary">Tickets</a>
      <a href="/moderation" class="btn btn-sm btn-outline-secondary">Moderation</a>
      <a href="/team" class="btn btn-sm btn-outline-secondary active">Team</a>
      <a href="/lizenz" class="btn btn-sm btn-outline-secondary">Lizenz</a>
    </div>
    <div class="d-flex align-items-center gap-3">
      <div id="guildSwitcher"></div>
      <div id="userInfo" class="d-flex align-items-center gap-2"></div>
      <a href="/auth/logout" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-box-arrow-right me-1"></i>Abmelden
      </a>
    </div>
  </nav>

  <div class="container-fluid py-4 px-4" style="max-width:1100px;margin:0 auto">
    <div id="notStaffHint" class="alert alert-secondary d-none">
      <i class="bi bi-lock-fill me-2"></i>Diese Seite ist nur für Team-Leitung sichtbar.
    </div>

    <div id="teamContent" class="d-none">
      <div class="tab-bar mb-4" id="teamTabs">
        <button class="tab-btn active" onclick="switchTab('roster')" id="tab-roster">
          <i class="bi bi-people-fill me-1"></i>Roster
        </button>
        <button class="tab-btn" onclick="switchTab('applications')" id="tab-applications">
          <i class="bi bi-clipboard-check-fill me-1"></i>Bewerbungen
        </button>
        <button class="tab-btn" onclick="switchTab('loa')" id="tab-loa">
          <i class="bi bi-airplane-fill me-1"></i>Urlaub
        </button>
      </div>

      <!-- Roster -->
      <div id="pane-roster">
        <div id="rosterCards" class="row g-3"></div>
      </div>

      <!-- Applications -->
      <div id="pane-applications" class="d-none">
        <div id="applicationsList"></div>
      </div>

      <!-- LOA -->
      <div id="pane-loa" class="d-none">
        <div id="loaList"></div>
      </div>
    </div>
  </div>

  <!-- Teamakte modal -->
  <div class="modal fade" id="warningsModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content bg-dark-card border-0">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title" id="warningsModalTitle"><i class="bi bi-folder-fill text-warning me-2"></i>Teamakte</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body"><div id="warningsList"></div></div>
      </div>
    </div>
  </div>

  <!-- Application decision modal -->
  <div class="modal fade" id="decideModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark-card border-0">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title"><i class="bi bi-clipboard-check-fill text-primary me-2"></i>Bewerbung entscheiden</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="decideAlert" class="alert d-none mb-3"></div>
          <input type="hidden" id="decideApplicationId" />
          <div id="decideAnswers" class="mb-3" style="max-height:40vh;overflow-y:auto"></div>
          <label class="form-label text-muted small">Interne Notiz (optional)</label>
          <textarea id="decideNote" class="form-control" rows="3" maxlength="500"></textarea>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-danger btn-sm" onclick="submitDecision(false)">Ablehnen</button>
          <button type="button" class="btn btn-success btn-sm px-4" onclick="submitDecision(true)">Annehmen</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/guildSwitcher.js"></script>
  <script src="/js/team.js"></script>
</body>
</html>
