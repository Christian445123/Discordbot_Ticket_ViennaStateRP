<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – Ticket-System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark-custom px-4 sticky-top">
    <a class="navbar-brand fw-bold" href="/dashboard">
      <i class="bi bi-ticket-perforated-fill text-primary me-2"></i>Ticket-System
    </a>
    <div class="d-flex align-items-center gap-3">
      <div id="userInfo" class="d-flex align-items-center gap-2"></div>
      <a href="/auth/logout" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-box-arrow-right me-1"></i>Abmelden
      </a>
    </div>
  </nav>

  <div class="container-fluid py-4 px-4">

    <!-- Stats -->
    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="stat-card">
          <div class="stat-label">Gesamt</div>
          <div class="stat-value" id="statTotal">–</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stat-card stat-open">
          <div class="stat-label">Offen</div>
          <div class="stat-value" id="statOpen">–</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stat-card stat-closed">
          <div class="stat-label">Geschlossen</div>
          <div class="stat-value" id="statClosed">–</div>
        </div>
      </div>
    </div>

    <!-- Tab bar + Create button -->
    <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
      <div class="tab-bar" id="tabBar">
        <button class="tab-btn active" onclick="switchTab('mine')" id="tab-mine">
          <i class="bi bi-person-fill me-1"></i>Meine Tickets
        </button>
        <button class="tab-btn d-none" onclick="switchTab('all')" id="tab-all">
          <i class="bi bi-grid-fill me-1"></i>Alle Tickets
        </button>
      </div>
      <button class="btn btn-primary btn-sm px-3" data-bs-toggle="modal" data-bs-target="#createModal">
        <i class="bi bi-plus-lg me-1"></i>Ticket erstellen
      </button>
    </div>

    <!-- Filters -->
    <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
      <input type="text" id="searchInput" class="form-control form-control-sm search-input"
             placeholder="Suche nach Betreff, Benutzer…" style="max-width:280px" />
      <select id="statusFilter" class="form-select form-select-sm" style="max-width:150px">
        <option value="">Alle Status</option>
        <option value="open">Offen</option>
        <option value="closed">Geschlossen</option>
      </select>
      <select id="categoryFilter" class="form-select form-select-sm" style="max-width:170px">
        <option value="">Alle Kategorien</option>
        <option>Support</option>
        <option>Bug-Report</option>
        <option>Bewerbung</option>
        <option>Beschwerde</option>
        <option>Allgemein</option>
      </select>
      <button class="btn btn-sm btn-outline-secondary ms-auto" onclick="loadTickets()">
        <i class="bi bi-arrow-clockwise me-1"></i>Aktualisieren
      </button>
    </div>

    <!-- Ticket table -->
    <div class="card bg-dark-card border-0 shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-dark table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>#</th>
                <th>Betreff</th>
                <th>Kategorie</th>
                <th id="colUser">Benutzer</th>
                <th>Status</th>
                <th>Erstellt</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="ticketTableBody">
              <tr>
                <td colspan="7" class="text-center text-muted py-4">
                  <div class="spinner-border spinner-border-sm me-2" role="status"></div>Lade Tickets…
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <p id="emptyHint" class="text-center text-muted mt-3 d-none">Keine Tickets gefunden.</p>
  </div>

  <!-- Create Ticket Modal -->
  <div class="modal fade" id="createModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark-card border-0">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title"><i class="bi bi-plus-circle-fill text-primary me-2"></i>Neues Ticket erstellen</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="createAlert" class="alert d-none mb-3"></div>
          <div class="mb-3">
            <label class="form-label text-muted small">Kategorie <span class="text-danger">*</span></label>
            <select id="createCategory" class="form-select">
              <option value="">— Bitte wählen —</option>
              <option value="Support">🛠️ Support</option>
              <option value="Bug-Report">🐛 Bug-Report</option>
              <option value="Bewerbung">📋 Bewerbung</option>
              <option value="Beschwerde">⚠️ Beschwerde</option>
              <option value="Allgemein">💬 Allgemein</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label text-muted small">Betreff <span class="text-danger">*</span></label>
            <input type="text" id="createSubject" class="form-control" placeholder="Kurze Beschreibung deines Anliegens" maxlength="100" />
          </div>
          <div class="mb-1">
            <label class="form-label text-muted small">Beschreibung <span class="text-muted">(optional)</span></label>
            <textarea id="createDescription" class="form-control" rows="4"
                      placeholder="Beschreibe dein Anliegen so genau wie möglich…" maxlength="1000"></textarea>
          </div>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Abbrechen</button>
          <button type="button" class="btn btn-primary btn-sm px-4" id="createSubmitBtn" onclick="submitCreateTicket()">
            <i class="bi bi-send-fill me-1"></i>Ticket erstellen
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
